{% extends "base.html" %}

{% block title %}Login - RoadFix{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            <span>R</span> Road<span>Fix</span>
        </div>

        <div class="auth-header">
            <div class="page-label">WELCOME BACK</div>
            <h1>Sign In</h1>
            <p>Login to manage and track your road damage reports.</p>
        </div>

        <form method="POST">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit" class="auth-button">
                Sign In →
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one</a>
        </p>

    </div>

</section>

{% endblock %}
